services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: 'host'
    volumes:
      - /media/IF4T/jelly/config:/config
      - /media/IF4T/jelly/cache:/cache
      - type: bind
        source: /media/IF4T/jelly/media
        target: /media
        read_only: true
    restart: 'unless-stopped'
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

